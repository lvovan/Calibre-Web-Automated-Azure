# Builds the CWA container image, publishes it to GHCR and deploys infra/main.bicep to Azure App Service.
# One-time setup: run infra/bootstrap.ps1 (or infra/bootstrap.sh) - see infra/README.md.
name: Azure - build & deploy

on:
  push:
    branches: [main]
    paths:
      - 'cps/**'
      - 'scripts/**'
      - 'root/**'
      - 'koreader/**'
      - 'empty_library/**'
      - 'Dockerfile'
      - '*requirements*.txt'
      - 'dirs.json'
      - 'cps.py'
      - 'infra/**'
      - '.github/workflows/azure-deploy.yml'
  workflow_dispatch:
    inputs:
      skip_build:
        description: 'Skip the image build and redeploy the current :latest image'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: azure-deploy
  cancel-in-progress: false

jobs:
  build:
    if: github.repository != 'crocodilestick/Calibre-Web-Automated' && !inputs.skip_build
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      build_number: ${{ steps.meta.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute image name and version
        id: meta
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          # The fork has no tags of its own: base the version on the newest upstream release it contains
          git fetch --quiet --no-tags https://github.com/crocodilestick/Calibre-Web-Automated.git '+refs/tags/v*:refs/tags/v*' || true
          base_version="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v0.0.0)"
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"
          echo "image=${repo}:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "version=${base_version}-azure.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          now=$(date -u +%s)
          echo "build_date=$(date -u -d "@${now}" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "build_number=$(date -u -d "@${now}" +%Y%m%d.%H%M%S)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.repo }}:latest
          build-args: |
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            VERSION=${{ steps.meta.outputs.version }}
            BUILD_NUMBER=${{ steps.meta.outputs.build_number }}
            INSTALL_KEPUBIFY=false
            UBUNTU_MIRROR=http://azure.archive.ubuntu.com/ubuntu/ http://mirrors.edge.kernel.org/ubuntu/ http://archive.ubuntu.com/ubuntu/
            PIP_EXCLUDE=google-api-python-client PyDrive2 oauth2client google-auth-oauthlib goodreads python-Levenshtein python-ldap Flask-SimpleLDAP scholarly
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Start the image on the runner (outside App Service, so the Azure storage
      # checks are skipped) to catch startup regressions before deploying.
      - name: Smoke-test image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          BUILD_NUMBER: ${{ steps.meta.outputs.build_number }}
        run: |
          docker run -d --name cwa -p 8083:8083 -e NETWORK_SHARE_MODE=true "$IMAGE"
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:8083/health; then ok=1; break; fi
            sleep 5
          done
          # Web uploads run as abc and write to the ingest dir (an anonymous Docker volume)
          writable=0
          docker exec cwa s6-setuidgid abc sh -c 'touch /cwa-book-ingest/.w && rm /cwa-book-ingest/.w' && writable=1
          build=$(curl -fsS http://localhost:8083/version | jq -r .build || true)
          docker logs cwa 2>&1 | tail -n 60
          docker rm -f cwa > /dev/null
          if [ "$ok" != 1 ]; then echo "::error::Image did not become healthy within 5 minutes"; exit 1; fi
          if [ "$writable" != 1 ]; then echo "::error::/cwa-book-ingest is not writable by abc"; exit 1; fi
          if [ "$build" != "$BUILD_NUMBER" ]; then echo "::error::/version returned build '${build}', expected ${BUILD_NUMBER}"; exit 1; fi

  deploy:
    needs: build
    if: always() && github.repository != 'crocodilestick/Calibre-Web-Automated' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # App Service starts the new container before stopping the old one. Both would then write
      # the SQLite databases on /home (SMB) at the same time, which corrupts them: stop the app
      # first so that only one container ever has them open.
      - name: Stop the app before deploying
        id: stop
        run: |
          app=$(az webapp list -g "${{ vars.AZURE_RESOURCE_GROUP }}" --query "[0].name" -o tsv)
          if [ -n "$app" ]; then
            az webapp stop -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "$app" -o none
            echo "app=${app}" >> "$GITHUB_OUTPUT"
            echo "Stopped ${app}"
          fi

      - name: Deploy Bicep
        id: deploy
        env:
          CWA_CONTAINER_IMAGE: ${{ needs.build.outputs.image || format('ghcr.io/{0}:latest', github.repository) }}
          CONTENT_STORAGE_CONNECTION_STRING: ${{ secrets.CONTENT_STORAGE_CONNECTION_STRING }}
          CONTENT_STORAGE_ACCOUNT_NAME: ${{ vars.CONTENT_STORAGE_ACCOUNT_NAME }}
          CONTENT_STORAGE_ACCOUNT_KEY: ${{ secrets.CONTENT_STORAGE_ACCOUNT_KEY }}
          LIBRARY_SHARE_NAME: ${{ vars.LIBRARY_SHARE_NAME || 'library' }}
          CUSTOM_DOMAIN_NAME: ${{ vars.CUSTOM_DOMAIN_NAME }}
          HARDCOVER_TOKEN: ${{ secrets.HARDCOVER_TOKEN }}
          ONEDRIVE_CLIENT_ID: ${{ vars.ONEDRIVE_CLIENT_ID }}
          ONEDRIVE_CLIENT_SECRET: ${{ secrets.ONEDRIVE_CLIENT_SECRET }}
        run: |
          export CWA_CONTAINER_IMAGE="${CWA_CONTAINER_IMAGE,,}"
          # A connection string takes precedence over the separate account name/key settings
          if [ -n "$CONTENT_STORAGE_CONNECTION_STRING" ]; then
            CONTENT_STORAGE_ACCOUNT_NAME=$(sed -n 's/.*AccountName=\([^;]*\).*/\1/p' <<<"$CONTENT_STORAGE_CONNECTION_STRING")
            CONTENT_STORAGE_ACCOUNT_KEY=$(sed -n 's/.*AccountKey=\([^;]*\).*/\1/p' <<<"$CONTENT_STORAGE_CONNECTION_STRING")
            echo "::add-mask::${CONTENT_STORAGE_ACCOUNT_KEY}"
          fi
          export CONTENT_STORAGE_ACCOUNT_NAME CONTENT_STORAGE_ACCOUNT_KEY
          if [ -n "$CONTENT_STORAGE_ACCOUNT_NAME" ] && [ -z "$CONTENT_STORAGE_ACCOUNT_KEY" ]; then
            echo "::error::Content storage account name is set but its key is missing."
            exit 1
          fi
          if [ -z "$CONTENT_STORAGE_ACCOUNT_NAME" ]; then
            echo "::warning::Content storage is not configured: /calibre-library is not mounted and the app will not start. Set the CONTENT_STORAGE_CONNECTION_STRING secret and redeploy."
            echo "content_configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "content_configured=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Deploying image ${CWA_CONTAINER_IMAGE}"
          outputs=$(az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "cwa-${GITHUB_RUN_ID}" \
            --parameters infra/main.bicepparam \
            --query properties.outputs -o json)
          echo "default_url=$(jq -r .defaultUrl.value <<<"$outputs")" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployment outputs"
            echo "- Default URL: $(jq -r .defaultUrl.value <<<"$outputs")"
            echo "- Custom URL: $(jq -r .customUrl.value <<<"$outputs")"
            echo "- Custom domain verification ID (asuid TXT): $(jq -r .customDomainVerificationId.value <<<"$outputs")"
          } >> "$GITHUB_STEP_SUMMARY"

      # Also runs when the deployment failed, so the previous version comes back up
      - name: Start the app
        if: always() && steps.stop.outputs.app != ''
        run: az webapp start -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${{ steps.stop.outputs.app }}" -o none

      # Healthy is not enough: the app must also report the build number of the image just built
      - name: Wait for /health and the new build
        if: steps.deploy.outputs.content_configured == 'true'
        env:
          EXPECTED_BUILD: ${{ needs.build.outputs.build_number }}
        run: |
          base="${{ steps.deploy.outputs.default_url }}"
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$base/health" || true)
            build=$(curl -s --max-time 20 "$base/version" | jq -r '.build // empty' 2>/dev/null || true)
            echo "Attempt $i: HTTP $code, build ${build:-?} (expected ${EXPECTED_BUILD:-any})"
            if [ "$code" = "200" ] && { [ -z "$EXPECTED_BUILD" ] || [ "$build" = "$EXPECTED_BUILD" ]; }; then
              echo "- Build: ${build}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 20
          done
          echo "::error::App did not become healthy on build ${EXPECTED_BUILD} within 20 minutes. Check Log stream / AppServiceConsoleLogs."
          exit 1
