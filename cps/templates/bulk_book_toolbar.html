<div id="bulk-book-toolbar" class="bulk-book-toolbar">
  <div id="bulk-book-actions" hidden>
    <label><input type="checkbox" id="bulk-book-all"> {{ _('Select all shown') }}</label>
    <span id="bulk-book-count" role="status" aria-live="polite"></span>
    <button type="button" class="btn btn-default" id="bulk-book-clear">{{ _('Clear selection') }}</button>
    <button type="button" class="btn btn-primary" id="bulk-book-edit" disabled>{{ _('Edit') }}</button>
  </div>
  <button type="button" class="btn btn-default" id="bulk-book-select" aria-pressed="false">{{ _('Select') }}</button>
</div>
