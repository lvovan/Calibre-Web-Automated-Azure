<!DOCTYPE html>
<html class="no-js">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
        <title>{{_('txt Reader')}} | {{title}}</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, user-scalable=no">
        <meta name="mobile-web-app-capable" content="yes">
        {% if g.google_site_verification|length > 0 %}
          <meta name="google-site-verification" content="{{g.google_site_verification}}">
        {% endif %}  

        {% include 'app_icons.html' %}

        <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" type="text/css"/>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/text.css') }}" type="text/css"/>

        <script src="{{ url_for('static', filename='js/libs/jquery.min.js') }}"></script>
        <script src="{{ url_for('static', filename='js/libs/plugins.js') }}"></script>
        <script>
            "use strict";
        </script>
        <script>
            window.cwaTxt = {progressSync: {{ progress_sync|tojson }}, csrfToken: {{ csrf_token()|tojson }}};
        </script>
        <script src="{{ url_for('static', filename='js/reading/progress-sync.js') }}"></script>
        <script src="{{ url_for('static', filename='js/reading/navigation.js') }}"></script>
        <script src="{{ url_for('static', filename='js/reading/txt_reader.js') }}"></script>
    </head>
    <body>
      <div id="readmain" data-load="{{ url_for('web.serve_book', book_id=txtfile, book_format='txt') }}">
        <div id="left" class="arrow" >‹</div>
        <div id="area"><pre id="content" class="content"></pre></div>
        <div id="right" class="arrow">›</div>
      </div>
      {% if progress_sync %}
      <button type="button" id="sync-now" title="{{_('Sync progress now')}}" aria-label="{{_('Sync progress now')}}"
              style="position:fixed;top:8px;right:8px;z-index:10;padding:2px 8px;font-size:16px;opacity:.6">&#x21bb;</button>
      {% endif %}
    </body>
</html>
